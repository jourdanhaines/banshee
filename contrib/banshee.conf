# banshee configuration
# https://github.com/jourdanhaines/banshee
#
# Format: `key = value`, one per line. Blank lines and #-comments are ignored,
# as are keys banshee does not recognize — so a config written for a newer
# version still loads on an older one.
#
# Every value below is the built-in default. Commented-out keys are shown with
# the value banshee uses when they are absent.

# ---------------------------------------------------------------------------
# Repositories
# ---------------------------------------------------------------------------

# Comma-separated list of directories to search for git repositories.
search_paths = ~/dev,~/projects,~/src

# Maximum directory depth to search for .git folders.
max_depth = 5

# How long (in seconds) to cache the repository list before rescanning.
# The launcher also rescans in the background whenever it is shown with a
# stale cache; `banshee -c` clears it outright.
cache_ttl = 300

# ---------------------------------------------------------------------------
# Terminal integration
# ---------------------------------------------------------------------------

# Keybinding the shell plugin binds to open banshee in the current terminal
# (ctrl-f, ctrl-g, ctrl-b, ctrl-p, ctrl-o).
keybind = ctrl-f

# Additional fzf options for the CLI picker, passed through as separate
# arguments. Split on whitespace — no shell quoting or expansion.
# fzf_opts = --color=16

# On shell startup, prompt to restore the last loaded target or group when any
# of its tmux sessions is not running. Set to false to disable.
startup_prompt = true

# ---------------------------------------------------------------------------
# Launcher (v1.0)
# ---------------------------------------------------------------------------

# Terminal emulator used to run `banshee <target>` when a session row is
# activated from the launcher. Empty means auto-detect: $TERMINAL first, then
# ghostty, kitty, alacritty, foot.
# terminal =

# Panel width in pixels.
# launcher_width = 640

# Maximum number of rows shown at once. 0 (the default) means unlimited —
# the list scrolls; set a positive number to cap it.
# max_results = 0

# Accent color, as a CSS hex color. Drives the border, the caret, the selection
# bar and the category badges.
# accent = #7aa2f7

# Panel opacity, 0.0-1.0. The window itself is always transparent; this is the
# alpha of the panel behind the results. Pair it with the banshee `layerrule` block
# in hyprland.conf for the frosted-glass look.
# window_opacity = 0.92

# Layer-shell keyboard mode: `exclusive` (banshee grabs the keyboard while it is
# open — the normal choice) or `on-demand` (escape hatch for compositors that
# mishandle exclusive focus).
# keyboard_mode = exclusive
