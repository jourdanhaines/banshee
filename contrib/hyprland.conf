# banshee — Hyprland snippet
#
# install.sh applies this automatically (rebinding $menu and appending the two
# layerrules, after taking a timestamped backup of hyprland.conf). Add it by
# hand if you installed with `make install`.
#
# `banshee doctor` prints the same three lines.

# Blur the launcher's layer surface. banshee's panel is drawn on a transparent
# window, so this rule is what turns it into frosted glass. Without it the
# panel is still perfectly readable — just opaque. `ignore_alpha = 0` keeps
# fully transparent pixels unblurred: crisp rounded corners, see-through
# margins. Block syntax requires Hyprland >= 0.53; on older releases use the
# legacy form `layerrule = blur, banshee` + `layerrule = ignorezero, banshee`.
layerrule {
    name = banshee
    match:namespace = banshee
    blur = on
    ignore_alpha = 0
}

# The launcher itself. Most Hyprland configs already bind $menu to a key
# (commonly `bind = $mainMod, SPACE, exec, $menu`), so redefining $menu is all
# that is needed to replace wofi/rofi.
$menu = banshee toggle

# If your config has no $menu variable, bind banshee directly instead:
# bind = $mainMod, SPACE, exec, banshee toggle
#
# `banshee toggle` starts the daemon on first use (detached, logging to
# ~/.local/state/banshee/daemon.log) and toggles the window on every later
# press, so no systemd unit is required. contrib/banshee.service is available
# for users who prefer the daemon started with the graphical session.
